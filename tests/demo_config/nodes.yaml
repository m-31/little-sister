# Live-demo node metadata (Mode 2) — see docs/testing-the-gui.md.
#
# The `nodes` aspect is the only way to label a node **no check owns** (ADR-0012 /
# ADR-0017): every demo check carries its own `title` and `about`, but the container
# nodes they hang under — /ci, /hosts, /security … — are created by the tree from the
# check paths and have nobody to describe them. Without this file the demo dashboard
# is a wall of bare path segments, which is exactly the gap the aspect exists for.
#
# Precedence is per field: nodes.yaml > the check's inline value > empty. Declaring a
# path no check covers is a startup warning, so the entries below all sit on a real
# branch of the demo tree.
#
# The `order:` keys are the **deployment** half of ADR-0055, the other half of what
# `/security/wiz` shows: those bands are ranked by the *check*, and the top-level
# cards here are ranked by the person who reads the wall — outside-in, rather than
# the alphabetical `ci hosts network security services storage`. A rank is static, so
# ADR-0024's positional stability holds: a card moves when somebody edits this file
# and never because a status changed. Delete every `order:` below and the wall goes
# back to alphabetical on the next restart.

/services:
  order: 1
  title: Public services
  about: Everything a visitor from outside touches.

/ci:
  order: 2
  title: Delivery
  about: |
    The build and review pipeline. Carries the demo's two **members** neighbors —
    a prose eruption beside a keyed review queue — so a dashboard shows reason
    lists that look alike and behave differently.

/network:
  order: 6
  title: Network
  about: Links between sites, and the tunnels over them.
  # A container no check speaks for gets its look here, as it gets its title
  # (ADR-0128): its links start as chips, and a tunnel that fails opens its way.
  chips: true

/storage:
  order: 5
  title: Storage
  about: Where the bytes live, and whether they were copied anywhere else.

/hosts:
  order: 4
  title: Hosts
  about: Machines, and the aspects a host check reports beneath each one.

/security:
  order: 3
  title: Security
  about: |
    Posture findings, two ways. The **audit** leaf stays **OK** while its list
    swells — severity is the leaf's own business, and a long list is not by itself
    an alarm. **Cloud posture** splits the same job across severity *bands*, each a
    node of its own that says where it sorts.

# The engine's heartbeat (ADR-0005). It owns no check, yet it is a fair metadata
# target and never an orphan: what lands here feeds the status strip and its hover
# card (ADR-0024), which is otherwise the one node on the page with no prose at all.
/little-sister:
  title: Little Sister
  about: |
    The monitor watching all of this — its own first-class node. If this one is
    quiet, nothing else on the page means anything.
