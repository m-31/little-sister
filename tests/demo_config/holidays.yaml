# The demo's holidays (ADR-0149): Bavaria's statewide public holidays and a company's
# own days off, read at the start as a deployment reads its own. Maintenance that leaves
# a list's days out reads them, *Not on* on its form and `not_on` in its entry (#35).
# docs/testing-the-gui.md, Mode 2's *Holidays*, says what to break here to see a list
# that cannot be read.
lists:
  DE-BY:
    name: holidays in Bavaria
    complete: [2026, 2027]
    dates:
      2026-01-01: New Year's Day
      2026-01-06: Epiphany
      2026-04-03: Good Friday
      2026-04-06: Easter Monday
      2026-05-01: Labor Day
      2026-05-14: Ascension Day
      2026-05-25: Whit Monday
      2026-06-04: Corpus Christi
      2026-10-03: German Unity Day
      2026-11-01: All Saints' Day
      2026-12-25: Christmas Day
      2026-12-26: Saint Stephen's Day
      2027-01-01: New Year's Day
      2027-01-06: Epiphany
      2027-03-26: Good Friday
      2027-03-29: Easter Monday
      2027-05-01: Labor Day
      2027-05-06: Ascension Day
      2027-05-17: Whit Monday
      2027-05-27: Corpus Christi
      2027-10-03: German Unity Day
      2027-11-01: All Saints' Day
      2027-12-25: Christmas Day
      2027-12-26: Saint Stephen's Day
  acme:
    name: ACME's company holidays
    complete: [2026, 2027]
    dates:
      2026-12-24: Christmas Eve
      2026-12-31: New Year's Eve
      2027-12-24: Christmas Eve
      2027-12-31: New Year's Eve
default: DE-BY
