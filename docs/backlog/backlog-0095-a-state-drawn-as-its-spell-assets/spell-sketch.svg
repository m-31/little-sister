<line x1="641.2" x2="641.2" y1="6" y2="48" stroke="#dee2e6" stroke-dasharray="2 3"/>
<line x1="72" x2="744" y1="48.5" y2="48.5" stroke="#dee2e6"/>
<path d="M72 47H285.6M515.2 47H639.3M644.9 47H744" fill="none" stroke="#212529" stroke-width="2"/>
