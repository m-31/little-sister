<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 132" width="760" height="132" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="title">A state drawn as the spell it lasted — a sketch</title>
<desc id="desc">Thirty days of one object's states on a time axis. While the state stood well, a line runs along the baseline; while it failed, a hollow box in the failure ink stands from the instant that state began to the instant the next one replaced it. Two failing spells: one of ten days, one of six hours.</desc>
<rect width="760" height="132" fill="#ffffff"/>
<text x="72" y="18" font-size="14" font-weight="600" fill="#212529">Accounts read</text>
<rect x="73" y="28" width="12" height="8" fill="#ffffff" stroke="#b02a37" stroke-width="2"/>
<text x="92" y="37" font-size="12" fill="#6c757d">failed for 10d 12h of 30d · 4 changes</text>
<g transform="translate(0 44)">
<line x1="170.8" x2="170.8" y1="6" y2="48" stroke="#dee2e6" stroke-dasharray="2 3"/>
