openapi: 3.1.0

# Little Sister — JSON output (backend mode).
# Normative contract for ADR-0080. Aligned with the Zalando RESTful API Guidelines
# (https://opensource.zalando.com/restful-api-guidelines/): content negotiation, no
# URL versioning (#115), Problem JSON errors (#176), snake_case properties (#118),
# UPPER_SNAKE_CASE enums (#240), RFC 3339 UTC date-times (#238), required meta (#218).
#
# Field provenance (maintainers — little-sister's ADRs, in its docs/adr/, also where a
# client keeps a copy of this file): the envelope is the snapshot published ADR-0080;
# node addressing ADR-0016; the three statuses and the contribution ADR-0032; entries
# ADR-0036 / ADR-0042; about + leaf description ADR-0012; title ADR-0017; config +
# report ADR-0013 / ADR-0044; Markdown text fields ADR-0018; maintenance ADR-0014;
# roll-up & staleness ADR-0039 / ADR-0005 / ADR-0079; the run facts ADR-0044 and the
# unit that answers for a node ADR-0078; sibling rank ADR-0055; show_when_quiet
# ADR-0063; instance facts ADR-0066; bearer token ADR-0003. The series read is
# ADR-0106 decision 6 and ADR-0122: a series' key, its two clocks and what a reading
# stood with ADR-0087; a measure ADR-0092 / ADR-0096 / ADR-0117; the node a series
# is shown on ADR-0106; the window ADR-0098. Consumer-facing
# `description:` text is kept self-contained; rationale lives in those ADRs and
# docs/api/README.md.

info:
  title: Little Sister Status API
  description: |-
    Read-only JSON view of the aggregated status tree.

    **What this publishes is what the dashboard renders.** A node carries the three
    statuses it has — what its check `reported`, its `own` status once its own
    suppressions apply, and the rolled-up effective `code` — plus what its parent
    counted (`contribution`), its entries, its maintenance pin, its last run, and the
    text and display metadata the client renders as Markdown. Children are returned in
    a deterministic order: a declared rank first (`order`), then natural,
    case-insensitive name order.

    The same resources back the HTML dashboard; the representation is chosen by
    `Accept` (content negotiation). `Accept: application/json` returns the JSON
    documented here and requires a bearer token; a browser receives HTML (session
    cookie), which is not part of this contract.

    A request returns the whole (sub)tree in one response — there is no pagination.
    An optional `X-Flow-Id` request header is echoed in the response, to correlate a
    request across logs.

    **The series read.** A check may keep what it read of a subject over time: its
    *series*. `GET /series` and `GET /series/{node_path}` answer every series that
    stands at or beneath a node — the node each is shown on, the key it is kept
    under, the measures drawn there and its readings, whole — over the window the
    request's `from` and `to` name. It is the Series view's own URL, answered as
    data: what an instance keeps, as it keeps it, for a script or a session that
    reads a running instance.

    **Versioning.** A field added to the served snapshot is added here in the same
    change, and such an addition is compatible: `schema_version` stays and
    `info.version` moves a minor. `schema_version` and the major move only when a
    field changes meaning or goes. There is no versioned media type and no
    compatibility window — the clients of this API are released with the server.

    2.0.0 is the first version in which the envelope is the snapshot rather than an
    older projection of it. Against 1.3.0: `own_code` is `own` and `reported` joins
    it; `contribution` is new; the string array `reasons` became the `entries` object;
    the `maintenance` bool and `maintenance_details` became one nullable `maintenance`
    object; the nullable `timestamp` and `frequency_seconds` became the `run` object,
    **absent** where nothing answers for a node; and `report`, `order`,
    `show_when_quiet` and the envelope's `instance` block are new. A client that meets
    a `schema_version` it does not know should say so and stop.

    2.7.0 adds the series read: two paths and their schemas, and the first `400` this
    API answers, for a window it cannot read. Nothing of the status read moves.

    See `docs/api/README.md` (linked below) for auth, `curl` examples and how tokens
    are provisioned.
  version: 2.7.0
  contact:
    name: little-sister
    url: https://github.com/m-31/little-sister
  license:
    name: MIT
    identifier: MIT
  x-api-id: 4374ef53-62ad-4e1d-9022-7df6f331bfc1
  x-audience: component-internal

externalDocs:
  description: Source, the usage guide (docs/api/README.md) and design decisions (docs/adr).
  url: https://github.com/m-31/little-sister

servers:
  - url: http://localhost:8888
    description: A single instance on the internal network (host/port are per deployment).

tags:
  - name: status
    description: The aggregated status tree and its branches.
  - name: series
    description: What the instance keeps of its subjects over time.

security:
  - bearerAuth: []

paths:
  /status:
    get:
      tags: [status]
      operationId: getStatusTree
      summary: The whole status tree
      description: >-
        Returns the root of the status tree, with every branch nested under it — one
        response, no pagination. Send `Accept: application/json` for the JSON
        representation documented here.
      parameters:
        - $ref: "#/components/parameters/FlowId"
      responses:
        "200":
          description: The status tree, wrapped in a versioned envelope.
          headers:
            X-Flow-Id:
              $ref: "#/components/headers/FlowId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /status/{node_path}:
    get:
      tags: [status]
      operationId: getStatusBranch
      summary: A branch of the status tree
      description: >-
        Returns the subtree rooted at `node_path`, with its descendants nested under
        it — one response, no pagination. The root itself is addressed by
        `GET /status`.
      parameters:
        - $ref: "#/components/parameters/NodePath"
        - $ref: "#/components/parameters/FlowId"
      responses:
        "200":
          description: The requested subtree, wrapped in a versioned envelope.
          headers:
            X-Flow-Id:
              $ref: "#/components/headers/FlowId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /series:
    get:
      tags: [series]
      operationId: getSeries
      summary: Every series the instance keeps
      description: >-
        Returns every series the instance keeps, each with the node it stands on,
        over the window `from` and `to` name — one response, no pagination, and
        everything kept where the request names no window. Send
        `Accept: application/json` for the JSON representation documented here; a
        browser receives the Series index, which is not part of this contract.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/FlowId"
      responses:
        "200":
          description: The series, wrapped in a versioned envelope.
          headers:
            X-Flow-Id:
              $ref: "#/components/headers/FlowId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesResponse"
        "400":
          $ref: "#/components/responses/BadWindow"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /series/{node_path}:
    get:
      tags: [series]
      operationId: getSeriesBranch
      summary: The series that stand at or beneath a node
      description: >-
        Returns every series that stands at or beneath the node at `node_path`, over
        the window `from` and `to` name — one response, no pagination. A series
        stands on the node that stands for its subject, and on its check's own node
        where none does; one shown above the node asked is returned where one of its
        measures names a node at or beneath it. **A node that exists always answers
        `200`**, with an empty `series` where none stands at or beneath it: `404`
        means that no node exists at the path, and nothing else. The root itself is
        addressed by `GET /series`.
      parameters:
        - $ref: "#/components/parameters/NodePath"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/FlowId"
      responses:
        "200":
          description: The series at or beneath the node, wrapped in a versioned envelope.
          headers:
            X-Flow-Id:
              $ref: "#/components/headers/FlowId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesResponse"
        "400":
          $ref: "#/components/responses/BadWindow"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >-
        An opaque bearer token issued by the application's operator, sent as
        `Authorization: Bearer <token>`. There is no self-service flow — request one
        from an operator/admin.

  parameters:
    NodePath:
      name: node_path
      in: path
      required: true
      description: >-
        Absolute, slash-separated path to a node, e.g. `system/db`. It may span
        several URL segments — node names are separated by `/`, and a name may itself
        contain `.` (an FQDN). The leading `/` is implied by the route.
      schema:
        type: string
        pattern: "^.+$"
        examples: ["system/db"]
    From:
      name: from
      in: query
      required: false
      description: >-
        Where the window starts: `now`; `now-` and a duration in seconds, minutes,
        hours, days or weeks (`now-90s`, `now-15m`, `now-6h`, `now-1d`, `now-1w`); or
        an ISO 8601 instant. An instant without an offset is read in the server's
        configured timezone, so send one with a `Z` or an offset. Left out, the
        window has no start and reaches back to the oldest reading kept.
      schema:
        type: string
        examples: ["now-6h", "2026-09-26T15:00:00Z"]
    To:
      name: to
      in: query
      required: false
      description: >-
        Where the window ends, written as `from` is. Left out, it is `now` where
        `from` is given, and the window has no end where neither is. `from` has to
        come before `to`.
      schema:
        type: string
        examples: ["now", "2026-09-26T16:00:00Z"]
    FlowId:
      name: X-Flow-Id
      in: header
      required: false
      description: >-
        Optional correlation id. When supplied it is echoed in the response
        `X-Flow-Id` header, so a request can be traced across logs.
      schema:
        type: string
        examples: ["abc-123"]

  headers:
    FlowId:
      description: Echo of the request's `X-Flow-Id`, present only when one was sent.
      schema:
        type: string

  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No node exists at the given path.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadWindow:
      description: >-
        The window cannot be read: `from` or `to` is written in none of the forms
        it takes, or `from` does not come before `to`. `detail` names the parameter
        and what it takes.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:

    StatusCode:
      type: string
      description: A node's status code. The vocabulary is closed.
      enum: [OK, WARN, ERROR, MAINTENANCE, UNDEFINED]

    Status:
      type: object
      description: |-
        A node in the status tree.

        A node has three statuses. `reported` is what its check said; `own` is the
        first derived value — what the node shows once its own suppressions apply, so
        a pinned node, or one whose addressable entries are every one of them pinned,
        reads `MAINTENANCE` here while `reported` still says what the check found; and
        `code` is the effective status, rolled up from the subtree and degraded when
        stale. A display client reads `code`. A federating parent grafts `own` plus
        `children` and re-rolls locally, so it never aggregates twice.
      properties:
        path:
          type: string
          description: Absolute, slash-separated location of the node; `/` for the tree root.
          examples: ["/system/db"]
        name:
          type: string
          description: The node's own name — the last path segment.
          examples: ["db"]
        reported:
          $ref: "#/components/schemas/StatusCode"
        own:
          $ref: "#/components/schemas/StatusCode"
        code:
          $ref: "#/components/schemas/StatusCode"
        contribution:
          description: >-
            What this node's parent counted, and the rule that made it something
            other than `code` — null when the parent counted `code`, which is the
            ordinary case.
          oneOf:
            - $ref: "#/components/schemas/Contribution"
            - type: "null"
        description:
          type: string
          description: >-
            What the node's check does — its purpose — kept separate from `about`
            (what the node *is*). For a branch check each leaf gets its own. Raw
            Markdown the client renders; empty when unset.
        about:
          type: string
          description: >-
            What the node *is* — host, location, kind, context. Raw Markdown the
            client renders; empty when unset.
        title:
          type: string
          description: A short display label for the node. Raw Markdown; empty when unset.
        config:
          type: string
          description: >-
            What the owning check ran *with* — its parameters, as raw Markdown. Empty
            for container nodes and for a node two or more checks write to, where no
            single check answers for it.
        report:
          type: string
          description: >-
            What the owning check's last run *found*, as raw Markdown — a roster, a
            count, whatever the run has to say that is not a status claim. Empty under
            the same condition as `config`.
        order:
          type: integer
          description: >-
            The declared sibling rank this node was sorted by; 0 where nobody declared
            one, which sorts before every positive rank. Published so a client can see
            the order it was handed rather than infer it from the sequence.
        show_when_quiet:
          type: [boolean, "null"]
          description: >-
            Whether this node's quiet lines are still worth showing. Null where nobody
            said — a stated `false` is a declaration and not a silence, so the three
            states are deliberately not two.
        maintenance:
          description: >-
            The maintenance pin on this node — why, by whom, when, until when — or
            null when nothing is pinned. *Pinned* is this being non-null; there is no
            separate flag.
          oneOf:
            - $ref: "#/components/schemas/Maintenance"
            - type: "null"
        stale:
          type: boolean
          description: >-
            True when this node or a descendant has not been observed within the
            tolerance the server applied (see `run.stale_after_seconds`). It is the
            server's verdict: a client shows it and does not recompute freshness from
            a clock it does not share.
        subject:
          type: string
          description: >-
            The object this node's check measured, as the identifier that check
            actually reached — a host, a URL, a provider's id — or empty where no
            check measures this node. Deliberately **not** the node's path: the path
            is the deployment's label for where the node hangs and may be moved or
            renamed, while this is the thing in the world the reading is about.
          examples: ["web01.example"]
        record:
          type: ["object", "null"]
          additionalProperties: true
          description: >-
            What that run **read** about the object — the measurement the node's
            code, lines and children are derived from — or null where nothing was
            read, including a run that failed to reach its object. Free-form beyond
            the timestamp keys `at`, `started` and `ended`, which are RFC 3339 UTC at
            any depth. It is data, never a claim: anything that should alarm is a
            reason. Empty on a mount two checks share, where no single writer can be
            believed.
          examples: [{"status": 200, "response_ms": 412}]
        shielded_by:
          type: [string, "null"]
          description: >-
            The path of the failing dependency this node is reached *through*, or null
            — which is every node that declared none and every node whose dependency
            is answering. While it is set, nothing of this node reaches its parent:
            a reading taken through a broken path is not evidence, in either
            direction, so an `OK` is withheld exactly as an `ERROR` is. The node's own
            `code` is untouched and says what the check actually found.
          examples: ["/net/vpn"]
        changes:
          type: integer
          minimum: 0
          description: >-
            How many times this node's own status changed in the last hour, counting
            only moves between `OK`, `WARN` and `ERROR`. Derived from the transition
            log and stored nowhere. A node's first reading is not a change of mind and
            is not counted; a transition that a rule kept from alarming **is**, because
            this is about the subject's behaviour and not about what a surface showed —
            which is what makes it the one number that says *this thing is flapping*.
          examples: [0]
        run:
          $ref: "#/components/schemas/Run"
        entries:
          $ref: "#/components/schemas/Entries"
        children:
          type: array
          description: >-
            Child nodes, ordered by declared rank first and then by name — natural
            and case-insensitive, so `node2` precedes `node10`.
          items:
            $ref: "#/components/schemas/Status"
      required:
        - path
        - name
        - reported
        - own
        - code
        - contribution
        - description
        - about
        - title
        - config
        - report
        - order
        - show_when_quiet
        - maintenance
        - stale
        - changes
        - entries
        - children

    Contribution:
      type: object
      description: >-
        What a node contributed to its parent's roll-up, when that was not its `code`.
      properties:
        code:
          description: >-
            The status the parent counted. **Null** where the node was not counted at
            all, which is what a rule that *withholds* a node does; a **real code**
            where a rule *transformed* the contribution, and then it is deliberately
            not the node's own `code` — that is the value the parent did not count.
          oneOf:
            - $ref: "#/components/schemas/StatusCode"
            - type: "null"
        by:
          type: string
          description: >-
            The rule that transformed the contribution. `maintenance` — the node, or
            every one of its addressable entries, is pinned. `undefined` — the node has
            never reported. `damping` — the node has read a worse code but not yet as
            many times in a row as this deployment asked for, so the parent still counts
            what it published before. Further rules add further names, which is a
            compatible change; treat an unknown name as "something changed what this
            node contributed" and show it.
          examples: ["maintenance"]
      required:
        - code
        - by

    Entries:
      type: object
      description: >-
        A node's reasons. Prose and members are different things, which is why this is
        an object and not an array.
      properties:
        addressable:
          type: boolean
          description: >-
            Whether these items are members that may be pinned one by one — each has a
            stable `slug` — rather than lines of prose about the node as a whole.
        items:
          type: array
          description: >-
            The entries, in the order the check emitted them. Never sorted.
          items:
            $ref: "#/components/schemas/Entry"
      required:
        - addressable
        - items

    Entry:
      type: object
      description: One of a node's reasons.
      properties:
        slug:
          type: string
          description: >-
            The entry's key, stable across runs, and what a pin on it is held against.
          examples: ["stress-api-pr-42"]
        text:
          type: string
          description: >-
            The line itself, as raw Markdown the client renders — a check may fence
            captured command or log output as a code block.
          examples: ["PR #42 waiting 6d"]
        code:
          description: >-
            The entry's own status, where the check declared one — null where it
            carries the node's, which is every entry that predates coded ones.
          oneOf:
            - $ref: "#/components/schemas/StatusCode"
            - type: "null"
        running:
          type: boolean
          description: >-
            Whether this line's subject has work in flight. Display only: it never
            affects the roll-up, so a red line whose job is re-running stays red.
        subject:
          type: string
          description: >-
            What this line is about, as the source's own identifier for it — a
            repository, a host — which several lines commonly share. Empty where the
            check did not say. It is what a view that groups groups by; it is never
            an address, and nothing may be pinned by it.
          examples: ["1296269"]
        data:
          description: >-
            The record: what the check read about that subject, beside the sentence
            in `text`, or null where it carried none. Free-form JSON in the check's
            own vocabulary — a client renders what it understands and may ignore the
            rest. A handful of names carry a type: `at`, `started` and `ended`, at
            any depth, are RFC 3339 UTC date-times or null.
          type: ["object", "null"]
          additionalProperties: true
          examples:
            - {"repository": "acme/widget", "workflow": "CI", "branch": "main",
               "verdict": "failure", "run_number": 41,
               "completed": {"at": "2026-09-19T09:12:00Z"}}
        refused:
          description: >-
            Why the server refused this line's record, where it did — `data` is then
            null — in the sentence the server's own page shows; null on every other
            line. The line itself stands as the check graded it: its text and its code
            are the check's, and only the record is missing.
          type: ["string", "null"]
          examples: ["it is 2,811 bytes and the limit is 2,048"]
        maintenance:
          description: The pin on this entry, or null when it is not pinned.
          oneOf:
            - $ref: "#/components/schemas/Maintenance"
            - type: "null"
      required:
        - slug
        - text
        - code
        - running
        - subject
        - data
        - refused
        - maintenance

    Run:
      type: object
      description: |-
        The last run's facts for the node.

        **Absent — not null — where nothing answers for this node**: a container above
        two or more checks, or a node below a branch check's mount whose next update
        belongs one level up. That is a different fact from *something answers and has
        never written*, which is this object present with a null `observed_at`.

        Nulls inside it are facts of their own, not missing data.
      properties:
        observed_at:
          type: [string, "null"]
          format: date-time
          description: >-
            When this node was last written (RFC 3339, UTC), or null where whatever
            answers for it has never run. Observation times are never aggregated.
          examples: ["2026-09-06T10:11:40Z"]
        wall_seconds:
          type: [number, "null"]
          minimum: 0
          description: >-
            How long the last run took, or null where there has been none to time.
        next_at:
          type: [string, "null"]
          format: date-time
          description: >-
            When the next run is due (RFC 3339, UTC) — the engine's armed slot, not
            `observed_at` plus the interval, because a failing check's next slot is
            pulled in. Null where there is no live schedule.
          examples: ["2026-09-06T10:18:40Z"]
        frequency_seconds:
          type: integer
          minimum: 1
          description: >-
            The interval a check reads this node's subject on. Absent where no check
            answers for it on a schedule — a paced unit, which has no period at all,
            and a node the engine re-asserts on its own tick, which is read but never
            checked. Such a node still names a `stale_after_seconds`.
        stale_after_seconds:
          type: number
          minimum: 0
          description: >-
            How old `observed_at` may get before `stale` turns true — the tolerance
            the server actually applied, so a client can say how fresh a reading is
            meant to be without holding a copy of the rule. Absent where the node
            cannot go stale by its own stamp.
      required:
        - observed_at
        - wall_seconds
        - next_at

    Maintenance:
      type: object
      description: >-
        Why something was pinned to MAINTENANCE, by whom, and when it auto-expires.
        Bounded — every pin has an expiry. The same shape on a node and on one of its
        entries.
      properties:
        note:
          type: string
          description: >-
            Why it was pinned, as raw Markdown for the client to render through its
            own safe renderer.
          examples: ["**Disk swap** — see [runbook](https://ops.example/runbook)"]
        set_by:
          type: string
          description: The admin who last wrote the pin.
          examples: ["ada"]
        set_at:
          type: string
          format: date-time
          description: When it was last written (RFC 3339, UTC).
          examples: ["2026-09-06T18:00:00Z"]
        expires_at:
          type: string
          format: date-time
          description: When it auto-expires (RFC 3339, UTC).
          examples: ["2026-09-13T18:00:00Z"]
        created_by:
          type: string
          description: >-
            The admin who first set it. Equal to `set_by` for a pin nobody has edited.
          examples: ["ada"]
        created_at:
          type: string
          format: date-time
          description: >-
            When it was first set (RFC 3339, UTC). Equal to `set_at` for a pin nobody
            has edited; clearing and re-pinning honestly starts a new creation.
          examples: ["2026-09-06T18:00:00Z"]
      required:
        - note
        - set_by
        - set_at
        - expires_at
        - created_by
        - created_at

    Instance:
      type: object
      description: >-
        Who answered this request. One response is one instance's answer, so these are
        per envelope and never per node.
      properties:
        version:
          type: string
          description: The serving instance's little-sister version.
          examples: ["0.3.16"]
        engine:
          type: string
          description: >-
            Whether this instance is running checks. `disabled` is a deployment that
            asked for no engine; `failed` is one whose configuration would not load,
            and its tree is whatever it holds from before.
          enum: [running, disabled, failed]
      required:
        - version
        - engine

    StatusResponse:
      type: object
      description: Versioned envelope around a status subtree.
      properties:
        schema_version:
          type: integer
          description: >-
            Major version of this JSON / federation schema. A client that meets a
            version it does not know should say so and stop.
          examples: [2]
        generated_at:
          type: string
          format: date-time
          description: The serving instance's clock when the snapshot was taken (RFC 3339, UTC).
          examples: ["2026-09-06T10:12:03Z"]
        instance:
          $ref: "#/components/schemas/Instance"
        status:
          $ref: "#/components/schemas/Status"
      required:
        - schema_version
        - generated_at
        - instance
        - status

    SeriesResponse:
      type: object
      description: >-
        Versioned envelope around the series that stand at or beneath a node.
      properties:
        schema_version:
          type: integer
          description: >-
            Major version of this JSON / federation schema. A client that meets a
            version it does not know should say so and stop.
          examples: [2]
        generated_at:
          type: string
          format: date-time
          description: >-
            The serving instance's clock when the request was read (RFC 3339, UTC) —
            the `now` a window back from now is measured from.
          examples: ["2026-09-26T15:45:00Z"]
        instance:
          $ref: "#/components/schemas/Instance"
        path:
          type: string
          description: The node asked, by its absolute path; `/` for the root.
          examples: ["/hosts/alpha"]
        window:
          $ref: "#/components/schemas/Window"
        series:
          type: array
          description: >-
            Every series that stands at or beneath the node asked, **empty where
            none does**. Ordered by the node each stands on: a node above the one
            asked first, then the tree's own order at and beneath it — a node before
            its children, siblings by declared rank and then by name — and by type,
            mount and subject where several stand on one node. A series with no
            reading inside the window keeps its place, with no readings.
          items:
            $ref: "#/components/schemas/Series"
      required:
        - schema_version
        - generated_at
        - instance
        - path
        - window
        - series

    Window:
      type: object
      description: >-
        The window the readings were taken from, as the server read the request's
        `from` and `to`. A window back from now is read by the server's clock, so
        these are the instants it meant. An end is null where the request left it
        open: it then bounds nothing, and the readings reach to the oldest or the
        newest kept.
      properties:
        from:
          type: [string, "null"]
          format: date-time
          description: Where the window starts (RFC 3339, UTC), or null.
          examples: ["2026-09-26T09:45:00Z"]
        to:
          type: [string, "null"]
          format: date-time
          description: Where the window ends (RFC 3339, UTC), or null.
          examples: ["2026-09-26T15:45:00Z"]
      required:
        - from
        - to

    Series:
      type: object
      description: |-
        What one check keeps of one subject over time: its readings, ordered by
        time and bounded by the retention the deployment gave the check.

        A series belongs to its check and its subject (`key`), and is shown on a
        node (`node`). The two are different things: the key is what the readings
        are kept under and does not move, the node is where the deployment's tree
        shows them and may.
      properties:
        node:
          type: string
          description: >-
            The absolute path of the node the series stands on: the node that stands
            for its subject, or its check's own node where none does. It is the node
            asked or one beneath it — or one **above** it, for a series returned
            because one of its measures names a node at or beneath the one asked.
          examples: ["/hosts/alpha"]
        key:
          $ref: "#/components/schemas/SeriesKey"
        measures:
          type: array
          description: >-
            The fields of the record that are drawn as curves, and where: the
            measures of this series' check that stand **at or beneath the node
            asked**, in the order they were declared. Empty where the check declares
            none, or none there. A measure is listed whether or not a reading gives
            it a number.
          items:
            $ref: "#/components/schemas/Measure"
        readings:
          type: array
          description: >-
            The series' readings inside the window, **oldest first** — both ends of
            the window included, by each reading's `at`. Empty where the window
            holds none.
          items:
            $ref: "#/components/schemas/Reading"
      required:
        - node
        - key
        - measures
        - readings

    SeriesKey:
      type: object
      description: >-
        What a series is kept under: the check that took the readings — its type
        and where it is mounted — and the subject they are of. It stays the same
        when a rename at the source moves the subject to another node.
      properties:
        type:
          type: string
          description: The check's type.
          examples: ["http"]
        mount:
          type: string
          description: >-
            The absolute path the check is mounted at. Two checks of different types
            may share one, and each keeps a series of its own.
          examples: ["/hosts/alpha/web"]
        subject:
          type: string
          description: >-
            The object the readings are of, as the identifier the check reached it
            by — a host, a URL, a provider's id. Never a node's path.
          examples: ["https://www.example.org"]
      required:
        - type
        - mount
        - subject

    Measure:
      type: object
      description: |-
        One field of a series' records that is drawn as a curve.

        **To read it out of a record**, flatten the record — join the keys from the
        top down to each value with `.` — and look `field` up. Never split `field`
        at its dots: a key may hold one.

        A deployment may declare one measure for every thing a record counts — every
        volume, every process. Those arrive here already told apart: one measure for
        each such thing the kept readings hold, whatever the window, with the
        thing's key in `field`, `label` and `node`.
      properties:
        field:
          type: string
          description: >-
            The field's dotted name in the flattened record.
          examples: ["volumes.root.pct"]
        unit:
          type: string
          description: >-
            The unit the field's numbers are in — free text, printed beside a value
            (`%`, `ms`, `KiB`), and empty where the measure has none.
          examples: ["%"]
        label:
          type: string
          description: What the curve is titled; the field's name where none was given.
          examples: ["Disk space used on root"]
        node:
          type: string
          description: >-
            The absolute path of the node the curve stands on — the node asked or
            one beneath it. It need not exist in the status tree.
          examples: ["/hosts/alpha/disk/root"]
        axis_to:
          type: [number, "null"]
          description: >-
            Where the curve's value axis reaches whatever its readings are — 100 for
            a percent of a whole — or null where it ends past its own highest
            reading. It is no limit: a reading may lie above it.
          examples: [100]
      required:
        - field
        - unit
        - label
        - node
        - axis_to

    Reading:
      type: object
      description: >-
        One kept reading of a subject: what was read, when, and how it stood.
      properties:
        at:
          type: string
          format: date-time
          description: >-
            The reading's time on the series' own clock (RFC 3339, UTC), which is
            what the series is ordered by and what a window is asked of: the
            record's own top-level `at` where it has one — a run sits where it
            finished — and otherwise when the reading was first observed.
          examples: ["2026-09-26T15:01:00Z"]
        observed_at:
          type: string
          format: date-time
          description: >-
            When the server last took this reading (RFC 3339, UTC). Later than `at`
            for a run read after it finished, and for a state or a run that was read
            again and stayed one reading.
          examples: ["2026-09-26T15:01:00Z"]
        code:
          description: >-
            The status the reading stood with where it landed — its line's, or its
            node's — or **null where it kept none**, which is a reading no line
            carried. A null is never an `OK`.
          oneOf:
            - $ref: "#/components/schemas/StatusCode"
            - type: "null"
        texts:
          type: array
          description: >-
            The sentences the reading stood with, as raw Markdown: its line's one,
            the lines of the node it was placed on, or none.
          items:
            type: string
          examples: [["HTTP 200 in 327 ms"]]
        identity:
          type: string
          description: >-
            The event the reading is of — a run's id, a job's — where its source
            keeps a history of such events: the same event read again is the same
            reading. Empty for a reading that names none.
          examples: ["run-4215"]
        state:
          type: string
          description: >-
            The state the subject stood in, for a reading that is one spell of it:
            an unchanged state read again is the same reading, and `at` is when the
            spell began. Empty for a reading that names none; a reading never names
            both an identity and a state.
          examples: ["disabled"]
        record:
          type: object
          additionalProperties: true
          description: >-
            What was read, whole — free-form JSON in the check's own vocabulary, of
            which only `at`, `started` and `ended` are typed, as RFC 3339 UTC
            date-times or null at any depth. An `error` that is not null says the
            reading failed.
          examples: [{"status": 200, "response_ms": 327}]
      required:
        - at
        - observed_at
        - code
        - texts
        - identity
        - state
        - record

    Problem:
      type: object
      description: A problem detail object (RFC 9457).
      properties:
        type:
          type: string
          format: uri
          default: "about:blank"
          description: A URI identifying the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: The HTTP status code.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: A URI identifying this specific occurrence.
