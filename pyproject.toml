[project]
name = "little-sister"
version = "0.3.20"
description = "Self-hosted status monitoring — checks are plain Python, from a homelab to a team"
authors = [
    { name = "Michael Meyling" }
]
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "monitoring", "status", "status-page", "dashboard",
    "self-hosted", "homelab", "devops", "flask",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "gunicorn>=22.0",
    "markdown-it-py[linkify]>=4.2.0",
    "PyYAML>=6.0",
    "tzdata>=2024.1",
]

[project.urls]
homepage = "https://github.com/m-31/little-sister"
repository = "https://github.com/m-31/little-sister"
documentation = "https://github.com/m-31/little-sister/tree/main/docs"
issues = "https://github.com/m-31/little-sister/issues"
changelog = "https://github.com/m-31/little-sister/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    # ShellCheck as a wheel, so the shell half of the gate runs through `uv run`
    # like the rest and needs nothing installed on the machine.
    "shellcheck-py>=0.11.0.1",
    "types-PyYAML",
]
# The browser boundary checks (tests/test_dashboard_browser.py, ADR-0056) hold
# the layout model against real paint. Deliberately *not* in `dev`: the
# everyday gate must not grow a browser download, and the tests skip cleanly
# without one. Install and run them explicitly — see docs/testing-the-gui.md:
#     uv sync --group browser && uv run playwright install chromium
#     uv run pytest tests/test_dashboard_browser.py
browser = [
    "playwright>=1.49",
]

[tool.ruff]
# The **floor**, not the interpreter this is developed on: the `UP` rules exist to
# propose modern idioms, and one the floor cannot run is a proposal to break the
# promise in `requires-python` (ADR-0054).
target-version = "py311"

[tool.ruff.lint]
# ruff-selection:begin
# One selection for the whole family, so every project lints identically and a
# fix argued in one of them is a fix in all of them. Beyond ruff's default (E, F):
# import sorting (I), pyupgrade (UP), bugbear (B), comprehensions (C4), the
# time-zone rules (DTZ) and Ruff's own rules (RUF). DTZ refuses a clock read and a
# time built without a zone, and a time that is meant as a wall time says so with
# a `noqa` and its reason (little-sister ADR-0120). Selecting explicitly also pins
# the gate against ruff's own defaults shifting between releases.
#
# The ambiguous-unicode rules are off, and stay off. This family's user-facing
# text — reasons, subnode titles, chip labels — uses typographic "—", "…", "×" and
# "·" on purpose, and a rule that flags them would be answered with a `noqa` on
# every line that has an opinion about punctuation.
# ruff-selection:end
select = ["E", "F", "W", "I", "UP", "B", "C4", "DTZ", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# The release tooling and its tests read the machine's clock without a zone: the
# stamps and dates they write are their own, on the one machine they run on, and no
# instance reads them. So the `DTZ` rules of the selection above (ADR-0120 decision
# 10) are not applied there. A release carries neither directory, and the entry
# matches nothing in one. The table is this project's own: the family's selection
# is `select` and `ignore`, not this.
"{src/little_sister/release,tests/release}/**" = ["DTZ"]

[tool.mypy]
# `wsgi.py` by name beside the package: a bare `files = ["src"]` type-checks
# everything except the one file that carries this installation's registration
# order, which is the file where getting it wrong is silent (little-sister ADR-0069).
files = ["src", "wsgi.py"]
strict = true

[tool.pytest.ini_options]
# Every browser test that installs Playwright's clock is left out of every run until
# they are fixed: on one Mac one or two of them time out a run, a different one each
# time, before the page they wait for is ready, and they pass elsewhere; 0.3.20 is
# cut without them. Left out rather than skipped, because a release refuses a
# skipped browser test. The fix takes the --deselect lines out.
addopts = [
    "--cov=little_sister", "--cov-report=term-missing",
    "--deselect=tests/test_assets_browser.py::StaleAssetsBrowserTests",
    "--deselect=tests/test_curve_frame_browser.py::CurveFrameBrowserTests::test_a_refresh_leaves_a_frame_where_a_reader_scrolled_it",
    "--deselect=tests/test_pin_browser.py::WallEditorBrowserTests::test_the_refresh_waits_while_an_editor_is_open",
    "--deselect=tests/test_pin_browser.py::WallEditorBrowserTests::test_an_answer_that_was_on_its_way_is_dropped",
    "--deselect=tests/test_pin_browser.py::WallEditorBrowserTests::test_a_miss_that_lands_while_an_editor_is_open_is_said_when_it_closes",
    "--deselect=tests/test_pin_browser.py::WallEditorBrowserTests::test_an_editor_closed_within_the_minute_leaves_no_dim_behind",
    "--deselect=tests/test_pin_browser.py::WallEditorBrowserTests::test_a_wall_left_with_an_editor_open_dims_after_a_minute",
    "--deselect=tests/test_pin_browser.py::WallEditorBrowserTests::test_a_branchs_head_makes_the_refresh_wait_and_stays_lit",
    "--deselect=tests/test_pin_browser.py::BranchLineBrowserTests::test_a_lines_editor_in_the_head_makes_the_refresh_wait",
    "--deselect=tests/test_pin_browser.py::WallEditorBrowserTests::test_a_cards_edit_and_clear_show_on_hover_or_keyboard_focus",
    "--deselect=tests/test_pin_browser.py::BranchLineBrowserTests::test_a_tap_on_a_lines_mark_opens_its_editor_and_not_the_nodes_card",
]

[build-system]
# The upper bound is one **major** line rather than one minor: uv generates
# `<0.12.0` because it pins the minor it shipped with, which turns every uv upgrade
# into a release-blocking edit — and the backend's own contract here is one sentence
# long (a `src/<import package>` layout), so a minor bump has nothing to break.
# Verified rather than assumed: the wheel and the sdist built by 0.11 and by 0.12
# carry byte-identical file lists. Widened deliberately, and re-narrowed the day a
# minor actually changes what it produces — and what would notice is not vigilance
# but the publish step, which opens the wheel and the sdist and refuses anything the
# release tree drops. A backend that started shipping extra files would fail there.
requires = ["uv_build>=0.11.14,<1.0.0"]
build-backend = "uv_build"
