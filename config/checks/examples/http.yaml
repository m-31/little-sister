# HTTP(S) check — TEMPLATE.
#
# Copy to checks/<node>_http.yaml and edit. Files under checks/examples/ are not
# loaded by the engine (sub-folders are ignored), so this is safe to keep here.
#
# GETs a URL and is OK when the response status is one of `expected_status`; any
# other status, or a transport failure, is ERROR. See checks/README.md.

type: http
path: /website              # absolute node path (ADR-0016)
description: HTTP endpoint returns an expected status
frequency: 5m                # how often to run
timeout: 10s                 # per-run timeout
# series_keep: 60            # readings kept per subject as its history (default 0: keep none)
# reading_cap: 10            # of those, the newest its page lists (default: settings.yaml's)
#
# What the kept readings are drawn by: a curve per measure on this node's page
# (ADR-0092). `http` declares its response time itself, so a kept series draws it
# with no key of its own. Name a field to relabel it, `null` to draw none, or
# another field of the record to add a curve.
# measures:
#   response_ms: {unit: ms, label: Response time}

# --- request ---------------------------------------------------------------
url: https://example.com     # the URL to GET (required)
# expected_status: 200       # an int, or a list e.g. [200, 204] (default: 200)

# Whether a 3xx is followed or reported. Default `true`, which is what this check has
# always done. Both readings are right somewhere, and they differ on the same URL:
#
#   true   — the status is whatever answers at the end of the chain. A site that has
#            moved keeps reporting OK, and a login wall answering 200 also reads as OK.
#   false  — a 3xx is the reading. Put the redirect codes you accept in
#            `expected_status` (e.g. [200, 301]) and a *new* redirect turns the check,
#            which is the point: `200` behind a chain is not proof the page is there.
#
# Must be a real boolean. `follow_redirects: "false"` is refused at load rather than
# read as true, because a switch that can mean its opposite is worse than none.
# follow_redirects: true
