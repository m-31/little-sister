# Host-metrics check — TEMPLATE.
#
# Copy to checks/<node>_host_metrics.yaml and edit. Files under checks/examples/ are not
# loaded by the engine (sub-folders are ignored), so this is safe to keep here.
#
# Reads basic system resources from a host over SSH and reports them under the
# host's node: an `ssh` transport leaf (OK; WARN on an ssh advisory such as the
# post-quantum key-exchange notice; ERROR on a failed connection) plus one leaf
# per metric — disk / memory / cpu / load — as siblings, each graded by its
# own pair (`max_disk`, …). Each leaf ships an `about` that says what to do when it
# warns or fails, and a handbook, read on its own tab, that says how to read it and what
# to do at length (ADR-0133). Auth must be non-interactive (BatchMode): set up key auth
# and a known host key first; the metrics need no root. See checks/README.md and
# docs/adr/0009-per-profile-metrics-scripts.md.

type: host-metrics
path: /myhost               # absolute node path (ADR-0016)
description: System resources (disk, memory, CPU, load) over SSH
frequency: 2m                # how often to run
timeout: 30s                 # per-run timeout
# series_keep: 60            # readings kept per subject as its history (default 0: keep none)
# reading_cap: 10            # of those, the newest its Series view lists (default: settings.yaml's)
#
# What the kept readings are drawn by (ADR-0092, ADR-0096): host-metrics declares the
# numbers it grades itself — memory, CPU and disk used in %, the load per core, and
# with `disk_path: all` or a list each volume's use — each curve on the aspect that
# grades it. Name a field to add a curve or relabel one, `null` to draw none; `node`
# puts a curve on a node beneath this one, and a `*` draws one per volume, on that
# volume's node:
# measures:
#   disk_avail_kb: {unit: KiB, label: Free space, node: disk}
#   volumes.*.avail_kb: {unit: KiB, label: Free space on *, node: disk/*}

# --- connection ------------------------------------------------------------
host: my-ssh-alias           # SSH target: a ~/.ssh/config alias or a hostname/FQDN
                             #   (often the same as `name`; e.g. node "nexus" → host "nexus62")
profile: linux               # host OS / userland — selects the metrics script + interpreter:
                             #   linux   (default) /proc + GNU awk + df -P, piped to bash
                             #   macos             BSD sysctl/vm_stat/top, piped to bash (3.2-safe)
                             #   busybox           QNAP / ASUS-ash, piped to sh, paranoid df parsing
# user: monitor              # SSH user (default: your local SSH user)
# port: 22                   # SSH port (default: 22 / your ssh_config)
# identity_file: ~/.ssh/id_ed25519
# sudo: false                # run the script under `sudo -n` (these metrics don't need root)
# debug: false               # add raw ssh stderr + df diagnostics to the `ssh` leaf
# script: my-host-metrics.sh    # override the profile's default script

# Extra `ssh -o` arguments, as one list, applied *before* little-sister's own
# defaults (so a host can override them). Useful ones:
#   "-o", "WarnWeakCrypto=no-pq-kex"           silence the post-quantum KEX warning on a
#                                              legacy host that can't offer a PQ key exchange
#   "-o", "PubkeyAcceptedAlgorithms=+ssh-rsa"  re-enable legacy SHA-1 RSA for an old server
#   "-o", "StrictHostKeyChecking=accept-new"   trust a new host key on first connect
# options: ["-o", "WarnWeakCrypto=no-pq-kex"]

# --- what to measure -------------------------------------------------------
# disk_path: /               # filesystem to measure; default is / (linux/busybox)
#                            #   or /System/Volumes/Data (macos)
# disk_path: all             # → a `disk` branch with one graded child per real filesystem
# disk_path:                 # → a `disk` branch with just these volumes (e.g. a NAS's data)
#   - /share/HDA_DATA
#   - /share/MD0_DATA

# --- grading ---------------------------------------------------------------
# Each aspect is a pair (ADR-0131): a value above `_warn` → WARN, above `_error` →
# ERROR, each level the last value that passes. These are the built-in defaults —
# set only the aspects a host needs to differ (e.g. a NAS that idles at a high load
# average); writing either level of a pair takes the pair as written, `_reason` is
# the sentence its line says when it fires, and `max_load: null` grades nothing.
# max_disk_warn: 80%         # percent used, each volume's alike
# max_disk_error: 90%
# max_memory_warn: 85%       # percent used
# max_memory_error: 95%
# max_cpu_warn: 85%          # percent busy
# max_cpu_error: 95%
# max_load_warn: 0.8         # 1-min load average per CPU core
# max_load_error: 1.0

# --- how it first looks on the wall (optional) ----------------------------
# The type proposes a host's leaves as chips, and a disk's filesystems where
# `disk_path` fans it out (ADR-0128): each chip shows its state, and a failing one
# opens by its card's budget. `chips: false` here opens a host's leaves; for a disk's,
# write `chips: false` in its entry of the `subnodes:` block below, beside its labels.
# On a host node another check shares, this speaks for its own leaves alone; for
# every leaf of the node at once, say in `nodes.yaml`.
# chips: false

# --- display text (optional) -----------------------------------------------
# Each leaf ships an `about` and a handbook. Override either — or add a `title` — per
# aspect here (ADR-0025, ADR-0133); an omitted field keeps the shipped one, `{default}`
# places it in yours, and a nodes.yaml entry still overrides above this, per path. What
# holds for every volume of a `disk` that fans out you give as the disk's `details`,
# which reach each volume beneath it; a volume carries its mount point.
# subnodes:
#   disk:
#     title: Data volume
#     about: |
#       {default} Ask the storage team before deleting anything under /srv.
#     details:
#       owner: Storage team
#   load:
#     handbook: handbook/nas-load.md   # your own, in the configuration's handbook/
