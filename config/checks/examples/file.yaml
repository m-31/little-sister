# File-freshness (heartbeat) check — TEMPLATE.
#
# Copy to checks/<node>_file.yaml and edit. Files under checks/examples/ are not
# loaded by the engine (sub-folders are ignored), so this is safe to keep here.
#
# OK while a file keeps being updated (modified within `max_age`'s levels); once it
# goes stale it warns or errs, as the level it went beyond says. Use it as a
# heartbeat for a job that writes or touches a file. A relative `file` path
# resolves under the runner's $HOME.
# See checks/README.md.

type: file
path: /nightly-export       # absolute node path (ADR-0016)
description: Heartbeat — the file stays fresh
frequency: 5m                # how often to run
timeout: 30s                 # per-run timeout
# series_keep: 60            # readings kept per subject as its history (default 0: keep none)
# reading_cap: 10            # of those, the newest its Series view lists (default: settings.yaml's)

# --- freshness -------------------------------------------------------------
file: logs/app.done          # file to watch; absolute, ~/…, or relative to $HOME (required)
# How old the file may be — a pair, each level the last age that passes (ADR-0131).
# The default is an error above 20m; writing either level takes the pair as written.
max_age_error: 20m           # ERROR once the file is older than this
# max_age_warn: 10m          # WARN once it is older than this
# max_age_reason: "The export runs every quarter of an hour."   # said when it fires
# max_age: null              # switches the judgment off: the age is still shown
