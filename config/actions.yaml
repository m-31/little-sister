# Deployment actions (ADR-0038) — a chip on a node, or on one of its reasons,
# linking into whatever this deployment uses. Configuration only: no code.
#
# This file is an example and is inert as it stands (every entry is commented out).
# `slot` says what the action is *about*, and the two slots already mean different
# things (ADR-0036):
#
#   node.actions     the whole node — the right place when its reasons are prose
#                    (a failure message and its stack trace are one condition)
#   reason.actions   one reason line — the right place when a check declares its
#                    findings as members, so each is separately actionable
#
# The url is a template. It may interpolate:
#
#   {path}      the node's absolute path, e.g. /system/alpha/disk
#   {name}      its last segment, e.g. disk
#   {code}      its status, e.g. ERROR
#   {reason}    the reason line (on a node action: the node's first line)
#   {reasons}   every reason line, newline-separated (a node action's body)
#
# Every value is percent-encoded on the way in, so a reason full of ampersands and
# quotes survives intact. A template naming anything else is refused at load, with
# the accepted names in the log — a button that lies is worse than no button.
#
# `icon` is optional and names an icon the links registry already knows
# (config/links/icons/, a registered pack, or the built-in one); an unknown name
# simply renders no icon. It also decides how a node action is drawn in a head's
# row: with an icon the action is a square like the head's own buttons, the image
# alone inside it and the label as its tooltip and accessible name; without one it
# is a small chip wearing its label. A line's action keeps the icon beside its label
# either way. Actions a head's row has no room for fold behind a ⋯ button, which
# lists them by their labels — never one alone where the state's own line beneath
# keeps it in the row. `under` is optional and limits the action to one subtree,
# compared segment-wise, so /system/alpha covers /system/alpha/disk and never
# /system/alphaville; `tag` is optional too and limits it to what carries one tag
# (ADR-0139), and where both are written both must hold. Omit them and the action is
# offered everywhere.

actions: []

